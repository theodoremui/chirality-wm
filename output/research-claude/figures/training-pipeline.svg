<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Training and evaluation pipeline for signed-belief world models</title>
  <desc id="desc">Five stages from left to right. 1: sample body families, each a mirror-twin pair with asymmetry b and minus b. 2: split whole families into training, validation and a locked test set before anything else is generated. 3: simulate probe, hold and query episodes on a fixed time grid; total force during the hold is the same for both twins. 4: the signed-belief world model keeps even and odd parts of its state apart, holds a two-sided belief about which side is stronger, and multiplies odd context with the odd query command before decoding. 5: score the locked test set once against an exact Bayesian reference using contrast skill: 1 means as good as the exact Bayes predictor, 0 means no better than predicting a symmetric body. Under each stage a strip states what the stage preserves and which leakage guard applies.</desc>
  <defs>
    <style>
      .bg { fill: #F7F8FA; }
      .card { fill: #FFFFFF; stroke: #E3E7ED; stroke-width: 1.2; }
      .h1 { font: 700 22px Inter, "Helvetica Neue", Arial, sans-serif; fill: #0F172A; }
      .sub { font: 400 14px Inter, "Helvetica Neue", Arial, sans-serif; fill: #5B6677; }
      .h2 { font: 650 16px Inter, "Helvetica Neue", Arial, sans-serif; fill: #0F172A; }
      .t { font: 400 12.5px Inter, "Helvetica Neue", Arial, sans-serif; fill: #334155; }
      .ts { font: 400 12px Inter, "Helvetica Neue", Arial, sans-serif; fill: #334155; }
      .tm { font: 400 11.5px Inter, "Helvetica Neue", Arial, sans-serif; fill: #64748B; }
      .tb { font: 600 12.5px Inter, "Helvetica Neue", Arial, sans-serif; fill: #1E293B; }
      .mono { font: 500 11.5px "JetBrains Mono", "SF Mono", Menlo, monospace; fill: #334155; }
      .badgeT { font: 700 13px Inter, Arial, sans-serif; fill: #FFFFFF; }
      .lbl { font: 600 10.5px Inter, Arial, sans-serif; letter-spacing: 0.06em; fill: #64748B; }
      .strip { fill: #F1F4F8; }
      .wire { stroke: #94A3B8; stroke-width: 1.6; fill: none; }
      .arrow { stroke: #0F172A; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke: #94A3B8; stroke-width: 1.4; stroke-dasharray: 4 4; fill: none; }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="thrust" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 9 L5 1 L10 9 Z" fill="#F26B5B"/>
    </marker>
    <marker id="thrustL" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 9 L5 1 L10 9 Z" fill="#F7A396"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="720"/>

  <!-- Header -->
  <text class="h1" x="40" y="52">How the data move from simulation to a locked test</text>
  <text class="sub" x="40" y="78">Whole body families are split before any episode, window or mirror copy exists. Every stage keeps the time grid, units and left/right channel names.</text>

  <!-- Stage connectors -->
  <g>
    <path class="arrow" d="M262 300 h14 m-6 -6 l6 6 l-6 6"/>
    <path class="arrow" d="M506 300 h14 m-6 -6 l6 6 l-6 6"/>
    <path class="arrow" d="M750 300 h14 m-6 -6 l6 6 l-6 6"/>
    <path class="arrow" d="M994 300 h14 m-6 -6 l6 6 l-6 6"/>
  </g>

  <!-- ============ Stage 1: families ============ -->
  <g transform="translate(40,110)">
    <rect class="card" x="0" y="0" width="218" height="400" rx="16"/>
    <circle fill="#0F172A" cx="26" cy="30" r="13"/><text class="badgeT" x="26" y="35" text-anchor="middle">1</text>
    <text class="h2" x="48" y="35">Sample families</text>
    <text class="t" x="20" y="66">One draw of the body's</text>
    <text class="t" x="20" y="83">parameters gives a mirror pair.</text>

    <!-- forward indicator -->
    <text class="lbl" x="109" y="112" text-anchor="middle">MIRROR</text>
    <path class="dash" d="M109 120 v108"/>

    <!-- cart b > 0 (top view, forward is up) -->
    <g transform="translate(26,130)">
      <path d="M10 18 v-28" stroke="#F26B5B" stroke-width="6" stroke-linecap="round" marker-end="url(#thrust)"/>
      <path d="M54 18 v-12" stroke="#F7A396" stroke-width="3" stroke-linecap="round" marker-end="url(#thrustL)"/>
      <rect x="0" y="20" width="64" height="44" rx="9" fill="#E9EEF5" stroke="#C9D3E0"/>
      <rect x="3" y="26" width="14" height="14" rx="3" fill="#F26B5B"/>
      <rect x="47" y="26" width="14" height="14" rx="3" fill="#F7A396"/>
      <text class="tb" x="32" y="88" text-anchor="middle">b &gt; 0</text>
      <text class="tm" x="32" y="104" text-anchor="middle">left stronger</text>
    </g>
    <!-- cart -b -->
    <g transform="translate(128,130)">
      <path d="M10 18 v-12" stroke="#F7A396" stroke-width="3" stroke-linecap="round" marker-end="url(#thrustL)"/>
      <path d="M54 18 v-28" stroke="#F26B5B" stroke-width="6" stroke-linecap="round" marker-end="url(#thrust)"/>
      <rect x="0" y="20" width="64" height="44" rx="9" fill="#E9EEF5" stroke="#C9D3E0"/>
      <rect x="3" y="26" width="14" height="14" rx="3" fill="#F7A396"/>
      <rect x="47" y="26" width="14" height="14" rx="3" fill="#F26B5B"/>
      <text class="tb" x="32" y="88" text-anchor="middle">−b</text>
      <text class="tm" x="32" y="104" text-anchor="middle">right stronger</text>
    </g>

    <text class="t" x="20" y="262">Twins share common gain,</text>
    <text class="t" x="20" y="279">lag, mass and noise level.</text>

    <rect class="strip" x="12" y="300" width="194" height="88" rx="10"/>
    <text class="lbl" x="24" y="320">KEEPS</text>
    <text class="ts" x="24" y="338">raw parameters, seeds, SI units</text>
    <text class="lbl" x="24" y="360">GUARD</text>
    <text class="ts" x="24" y="378">both twins carry one family ID</text>
  </g>

  <!-- ============ Stage 2: split ============ -->
  <g transform="translate(284,110)">
    <rect class="card" x="0" y="0" width="218" height="400" rx="16"/>
    <circle fill="#0F172A" cx="26" cy="30" r="13"/><text class="badgeT" x="26" y="35" text-anchor="middle">2</text>
    <text class="h2" x="48" y="35">Split families first</text>
    <text class="t" x="20" y="66">Whole families go to one split,</text>
    <text class="t" x="20" y="83">with every twin and branch.</text>

    <g transform="translate(20,106)">
      <rect fill="#D3F2EF" x="0" y="0" width="178" height="40" rx="9"/>
      <rect fill="#12A39B" x="0" y="0" width="8" height="40" rx="4"/>
      <text class="tb" x="20" y="25">Training</text><text class="tm" x="168" y="25" text-anchor="end">fit weights</text>

      <rect fill="#E2E4FD" x="0" y="52" width="178" height="40" rx="9"/>
      <rect fill="#6366F1" x="0" y="52" width="8" height="40" rx="4"/>
      <text class="tb" x="20" y="77">Validation</text><text class="tm" x="168" y="77" text-anchor="end">choose settings</text>

      <rect fill="#FDF0D3" x="0" y="104" width="178" height="40" rx="9"/>
      <rect fill="#E59A0B" x="0" y="104" width="8" height="40" rx="4"/>
      <text class="tb" x="20" y="129">Locked test</text>
      <g transform="translate(146,114)">
        <rect x="0" y="8" width="16" height="12" rx="2.5" fill="#E59A0B"/>
        <path d="M3.5 8 v-3 a4.5 4.5 0 0 1 9 0 v3" fill="none" stroke="#E59A0B" stroke-width="2"/>
      </g>
    </g>
    <text class="t" x="20" y="278">Split sizes come from a pilot</text>
    <text class="t" x="20" y="295">on separate families.</text>

    <rect class="strip" x="12" y="300" width="194" height="88" rx="10"/>
    <text class="lbl" x="24" y="320">KEEPS</text>
    <text class="ts" x="24" y="338">hashed family-to-split list</text>
    <text class="lbl" x="24" y="360">GUARD</text>
    <text class="ts" x="24" y="378">no family in two splits</text>
  </g>

  <!-- ============ Stage 3: episodes ============ -->
  <g transform="translate(528,110)">
    <rect class="card" x="0" y="0" width="218" height="400" rx="16"/>
    <circle fill="#0F172A" cx="26" cy="30" r="13"/><text class="badgeT" x="26" y="35" text-anchor="middle">3</text>
    <text class="h2" x="48" y="35">Probe, hold, query</text>
    <text class="t" x="20" y="66">The probe reveals the side, the</text>
    <text class="t" x="20" y="83">hold hides it, the query tests it.</text>

    <g transform="translate(18,104)">
      <rect x="0" y="0" width="52" height="128" rx="6" fill="#FDE3DF" opacity="0.65"/>
      <rect x="54" y="0" width="86" height="128" rx="6" fill="#EEF1F5"/>
      <rect x="142" y="0" width="40" height="128" rx="6" fill="#E2E4FD"/>
      <text class="lbl" x="26" y="14" text-anchor="middle">PROBE</text>
      <text class="lbl" x="97" y="14" text-anchor="middle">HOLD</text>
      <text class="lbl" x="162" y="14" text-anchor="middle">QUERY</text>
      <text class="tm" x="2" y="34">u</text>
      <path d="M8 54 h4 v-14 h8 v14 h4 v14 h8 v-14 h4 v-18 h8 v18 h6 h86 h4 v-12 h34" fill="none" stroke="#F26B5B" stroke-width="2" stroke-linejoin="round"/>
      <text class="tm" x="2" y="88">F₊</text>
      <path d="M8 104 c4 -6 8 -10 12 -2 c4 8 8 8 12 2 c4 -8 8 -12 12 -2 c4 6 6 4 10 2 h86 c6 0 8 -10 14 -10 h22" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
      <text class="tm" x="97" y="122" text-anchor="middle">same for b and −b</text>
    </g>
    <text class="mono" x="20" y="262">obs    [E, T, 3]</text>
    <text class="mono" x="20" y="278">cmd    [E, T, 2]</text>
    <text class="mono" x="20" y="294">target [E, H, 3]</text>

    <rect class="strip" x="12" y="300" width="194" height="88" rx="10"/>
    <text class="lbl" x="24" y="320">KEEPS</text>
    <text class="ts" x="24" y="338">time grid and channel names</text>
    <text class="lbl" x="24" y="360">GUARD</text>
    <text class="ts" x="24" y="378">inputs end at the query start</text>
  </g>

  <!-- ============ Stage 4: model ============ -->
  <g transform="translate(772,110)">
    <rect class="card" x="0" y="0" width="218" height="400" rx="16"/>
    <circle fill="#0F172A" cx="26" cy="30" r="13"/><text class="badgeT" x="26" y="35" text-anchor="middle">4</text>
    <text class="h2" x="48" y="35">Signed-belief model</text>
    <text class="t" x="20" y="66">Even and odd parts stay apart</text>
    <text class="t" x="20" y="83">until the odd × odd product.</text>

    <g transform="translate(20,98)">
      <rect x="0" y="0" width="178" height="26" rx="13" fill="#EEF1F5"/>
      <text class="tb" x="89" y="17" text-anchor="middle">encoder + recurrent update</text>
      <path d="M89 26 v10" class="wire" marker-end="url(#head)"/>
      <rect fill="#DCE8FD" x="0" y="40" width="88" height="26" rx="6"/>
      <rect fill="#FDE3DF" x="90" y="40" width="88" height="26" rx="6"/>
      <text class="tb" x="44" y="57" text-anchor="middle" style="fill:#1D4ED8">even</text>
      <text class="tb" x="134" y="57" text-anchor="middle" style="fill:#C2410C">odd</text>
      <path d="M134 66 v10" class="wire" marker-end="url(#head)"/>
      <rect x="90" y="80" width="88" height="46" rx="8" fill="#FFFFFF" stroke="#F3B1A7"/>
      <rect x="100" y="104" width="12" height="14" rx="2" fill="#F26B5B" opacity="0.45"/>
      <rect x="156" y="92" width="12" height="26" rx="2" fill="#F26B5B"/>
      <text class="tm" x="106" y="98" text-anchor="middle">L</text>
      <text class="tm" x="162" y="88" text-anchor="middle">R</text>
      <text class="tm" x="134" y="122" text-anchor="middle">belief</text>
      <circle cx="134" cy="150" r="13" fill="#FFFFFF" stroke="#F26B5B" stroke-width="1.6"/>
      <path d="M128 144 l12 12 M140 144 l-12 12" stroke="#F26B5B" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M134 126 v10" class="wire"/>
      <text class="tm" x="178" y="154" text-anchor="end">u</text>
      <path d="M168 150 h-19" class="wire" marker-end="url(#head)"/>
      <path d="M44 66 v100" class="wire"/>
      <path d="M121 150 h-20 q-8 0 -8 8 v8" class="wire"/>
      <rect x="0" y="170" width="178" height="26" rx="13" fill="#0F172A"/>
      <text class="tb" x="89" y="187" text-anchor="middle" style="fill:#FFFFFF">decoder → response</text>
    </g>

    <rect class="strip" x="12" y="300" width="194" height="88" rx="10"/>
    <text class="lbl" x="24" y="320">KEEPS</text>
    <text class="ts" x="24" y="338">outputs on the target grid</text>
    <text class="lbl" x="24" y="360">GUARD</text>
    <text class="ts" x="24" y="378">settings chosen on validation</text>
  </g>

  <!-- ============ Stage 5: score ============ -->
  <g transform="translate(1016,110)">
    <rect class="card" x="0" y="0" width="218" height="400" rx="16"/>
    <circle fill="#0F172A" cx="26" cy="30" r="13"/><text class="badgeT" x="26" y="35" text-anchor="middle">5</text>
    <text class="h2" x="48" y="35">Score once</text>
    <text class="t" x="20" y="66">Compare with the exact Bayes</text>
    <text class="t" x="20" y="83">answer from the same history.</text>

    <g transform="translate(24,98)">
      <path d="M0 116 h168 M84 4 v112" stroke="#CBD5E1" stroke-width="1.2"/>
      <path d="M8 110 L160 10" class="dash"/>
      <path d="M8 94 L160 26" stroke="#0F172A" stroke-width="2"/>
      <g fill="#F26B5B" opacity="0.85">
        <circle cx="20" cy="92" r="3.2"/><circle cx="34" cy="84" r="3.2"/><circle cx="46" cy="82" r="3.2"/>
        <circle cx="60" cy="76" r="3.2"/><circle cx="72" cy="68" r="3.2"/><circle cx="96" cy="56" r="3.2"/>
        <circle cx="110" cy="52" r="3.2"/><circle cx="124" cy="42" r="3.2"/><circle cx="138" cy="38" r="3.2"/><circle cx="150" cy="28" r="3.2"/>
      </g>
      <text class="tm" x="84" y="132" text-anchor="middle">Bayes mean of the contrast</text>
      <text class="tm" x="164" y="8" text-anchor="end">Bayes</text>
    </g>
    <g transform="translate(20,240)">
      <rect x="0" y="0" width="178" height="24" rx="12" fill="#EEF1F5"/>
      <text class="ts" x="89" y="16" text-anchor="middle"><tspan font-weight="600">S</tspan>  contrast skill (1 = Bayes)</text>
      <rect x="0" y="30" width="178" height="24" rx="12" fill="#EEF1F5"/>
      <text class="ts" x="89" y="46" text-anchor="middle"><tspan font-weight="600">0</tspan> = a symmetric body</text>
    </g>

    <rect class="strip" x="12" y="300" width="194" height="88" rx="10"/>
    <text class="lbl" x="24" y="320">KEEPS</text>
    <text class="ts" x="24" y="338">physical units of every target</text>
    <text class="lbl" x="24" y="360">GUARD</text>
    <text class="ts" x="24" y="378">opened once, settings frozen</text>
  </g>

  <!-- Training loop annotation -->
  <g>
    <path d="M881 524 v14 q0 10 -10 10 h-470 q-10 0 -10 -10 v-14" class="wire" marker-end="url(#head)"/>
    <text class="tm" x="641" y="572" text-anchor="middle">Training reads only the training split, validation chooses settings, and the test split stays sealed until stage 5.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40,598)">
    <rect x="0" y="0" width="1200" height="96" rx="14" fill="#FFFFFF" stroke="#E3E7ED"/>
    <text class="lbl" x="24" y="28">KEY</text>
    <rect fill="#3B82F6" x="24" y="42" width="14" height="14" rx="3"/>
    <text class="t" x="46" y="54">even: unchanged by the mirror (total force, forward speed)</text>
    <rect fill="#F26B5B" x="24" y="66" width="14" height="14" rx="3"/>
    <text class="t" x="46" y="78">odd: sign flips under the mirror (asymmetry b, differential command u)</text>
    <path class="dash" d="M470 49 h28"/>
    <text class="t" x="508" y="54">exact Bayesian reference</text>
    <path d="M470 73 h28" stroke="#0F172A" stroke-width="2"/>
    <text class="t" x="508" y="78">learned model</text>
    <text class="t" x="720" y="54">Mirror M swaps left and right and flips every odd quantity.</text>
    <text class="t" x="720" y="78">An odd × odd product is even, so b·u can change total force.</text>
  </g>
</svg>
