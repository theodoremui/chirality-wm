<svg xmlns="http://www.w3.org/2000/svg" width="740" height="308" viewBox="0 0 740 308" role="img" aria-labelledby="title desc">
  <title id="title">Which settings remove the interaction?</title>
  <desc id="desc">Each panel contains two load polarities crossed with two camera polarities. The diagonal settings both contribute positive g. Using every setting averages positive and negative g to zero.</desc>
  <rect width="740" height="308" rx="12" fill="#f7f9fa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#162e3a">
    <text x="24" y="37" font-size="25" font-weight="700">Which settings cancel the interaction?</text>
    <text x="24" y="66" font-size="17">Each filled cell shows its contribution from the interaction.</text>
    <path d="M370 87 V284" fill="none" stroke="#c5d0d4" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="185" y="105" font-size="19" font-weight="700">Two diagonal settings</text>
      <text x="554" y="105" font-size="19" font-weight="700">All four settings</text>
      <g font-size="16" fill="#354f5d">
        <text x="160" y="140">Camera +</text><text x="262" y="140">Camera −</text>
        <text x="525" y="140">Camera +</text><text x="627" y="140">Camera −</text>
      </g>
      <g fill="#e3f0ee" stroke="#658b87" stroke-width="1.3">
        <rect x="111" y="151" width="98" height="40" rx="6"/><rect x="213" y="195" width="98" height="40" rx="6"/>
        <rect x="476" y="151" width="98" height="40" rx="6"/><rect x="578" y="195" width="98" height="40" rx="6"/>
      </g>
      <g fill="#f6eadb" stroke="#a4784c" stroke-width="1.3">
        <rect x="578" y="151" width="98" height="40" rx="6"/><rect x="476" y="195" width="98" height="40" rx="6"/>
      </g>
      <g fill="#fff" stroke="#92a1a8" stroke-width="1.3" stroke-dasharray="4 4">
        <rect x="213" y="151" width="98" height="40" rx="6"/><rect x="111" y="195" width="98" height="40" rx="6"/>
      </g>
      <g font-size="16" fill="#354f5d" text-anchor="end">
        <text x="100" y="177">Load +</text><text x="100" y="221">Load −</text>
        <text x="465" y="177">Load +</text><text x="465" y="221">Load −</text>
      </g>
      <g font-size="23" font-weight="700">
        <text x="160" y="179">+g</text><text x="262" y="223">+g</text>
        <text x="525" y="179">+g</text><text x="627" y="179">−g</text>
        <text x="525" y="223">−g</text><text x="627" y="223">+g</text>
      </g>
      <text x="185" y="277" font-size="18" font-weight="700">Mean readout = b + g</text>
      <text x="554" y="277" font-size="18" font-weight="700">Mean readout = b</text>
    </g>
  </g>
</svg>
