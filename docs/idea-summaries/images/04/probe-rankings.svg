<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360" role="img" aria-labelledby="title desc"><title id="title">Two pulse designs favor different goals</title><desc id="desc">Exact one-step calculations. Sign information is 0.167 nats for A and 0.191 for B. Log growth of two-sided evidence is 0.247 nats for A and 0.220 for B.</desc><rect x="0" y="0" width="740" height="360" rx="12" fill="#f7fafb"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="38" font-size="24" fill="#172f43" font-weight="700" text-anchor="start">Which pulse is preferable at a 90% sign belief?</text>
<text x="24" y="70" font-size="17" fill="#455d70" font-weight="400" text-anchor="start">Expected gain in natural log units per trial</text>
<text x="34" y="120" font-size="21" fill="#172f43" font-weight="700" text-anchor="start">Learn the sign</text>
<text x="34" y="146" font-size="17" fill="#455d70" font-weight="400" text-anchor="start">Expected information</text>
<text x="34" y="194" font-size="18" fill="#172f43" font-weight="700" text-anchor="start">A</text>
<rect x="66" y="175" width="117.2318" height="25" rx="2" fill="#147169"/>
<text x="191.23180000000002" y="194" font-size="17" fill="#172f43" font-weight="400" text-anchor="start">0.167</text>
<text x="34" y="250" font-size="18" fill="#172f43" font-weight="700" text-anchor="start">B</text>
<rect x="66" y="231" width="133.9506" height="25" rx="2" fill="#235780"/>
<text x="207.9506" y="250" font-size="17" fill="#172f43" font-weight="400" text-anchor="start">0.191</text>
<path d="M66 268 L241 268" stroke="#a0b2bd" fill="none" stroke-width="1.5"/>
<path d="M66 265 L66 274" stroke="#a0b2bd" fill="none" stroke-width="1.5"/>
