<svg xmlns="http://www.w3.org/2000/svg" width="740" height="337" viewBox="0 0 740 337" role="img" aria-labelledby="title desc"><title id="title">A late marker loses value when assignments switch</title><desc id="desc">Exact binary Bayes accuracy for 10 percent readout and marker errors and independent switching probabilities of 0, 5 or 15 percent per step. The horizontal axis spans zero to twenty steps.</desc>
<rect width="740" height="337" rx="14" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif">
<text x="24" y="35" text-anchor="start" fill="#172c45" font-size="23" font-weight="700">How long can a late marker resolve an earlier pulse?</text>
<text x="25" y="73" text-anchor="start" fill="#40576c" font-size="17" font-weight="400">Probability of a correct side decision (50% is chance)</text>
<line x1="92" y1="249.0" x2="592" y2="249.0" stroke="#d7e0e8" stroke-width="1.4"/>
<text x="76" y="254.0" text-anchor="end" fill="#40576c" font-size="16" font-weight="400">50%</text>
<line x1="92" y1="209.0" x2="592" y2="209.0" stroke="#d7e0e8" stroke-width="1.4"/>
<text x="76" y="214.0" text-anchor="end" fill="#40576c" font-size="16" font-weight="400">60%</text>
<line x1="92" y1="169.0" x2="592" y2="169.0" stroke="#d7e0e8" stroke-width="1.4"/>
<text x="76" y="174.0" text-anchor="end" fill="#40576c" font-size="16" font-weight="400">70%</text>
<line x1="92" y1="129.0" x2="592" y2="129.0" stroke="#d7e0e8" stroke-width="1.4"/>
<text x="76" y="134.0" text-anchor="end" fill="#40576c" font-size="16" font-weight="400">80%</text>
<line x1="92" y1="265" x2="592" y2="265" stroke="#40576c" stroke-width="1.3"/>
<line x1="92" y1="101" x2="92" y2="265" stroke="#40576c" stroke-width="1.3"/>
<line x1="92" y1="265" x2="92" y2="271" stroke="#40576c" stroke-width="1.4"/>
<text x="92" y="289" text-anchor="middle" fill="#40576c" font-size="16" font-weight="400">0</text>
<line x1="217" y1="265" x2="217" y2="271" stroke="#40576c" stroke-width="1.4"/>
<text x="217" y="289" text-anchor="middle" fill="#40576c" font-size="16" font-weight="400">5</text>
<line x1="342" y1="265" x2="342" y2="271" stroke="#40576c" stroke-width="1.4"/>
<text x="342" y="289" text-anchor="middle" fill="#40576c" font-size="16" font-weight="400">10</text>
<line x1="467" y1="265" x2="467" y2="271" stroke="#40576c" stroke-width="1.4"/>
<text x="467" y="289" text-anchor="middle" fill="#40576c" font-size="16" font-weight="400">15</text>
<line x1="592" y1="265" x2="592" y2="271" stroke="#40576c" stroke-width="1.4"/>
<text x="592" y="289" text-anchor="middle" fill="#40576c" font-size="16" font-weight="400">20</text>
<text x="609" y="95" text-anchor="start" fill="#40576c" font-size="16" font-weight="700">Swap chance</text>
<text x="346" y="318" text-anchor="middle" fill="#172c45" font-size="17" font-weight="400">Unobserved steps between pulse and marker</text>
<polyline points="92.0,121.0 117.0,121.0 142.0,121.0 167.0,121.0 192.0,121.0 217.0,121.0 242.0,121.0 267.0,121.0 292.0,121.0 317.0,121.0 342.0,121.0 367.0,121.0 392.0,121.0 417.0,121.0 442.0,121.0 467.0,121.0 492.0,121.0 517.0,121.0 542.0,121.0 567.0,121.0 592.0,121.0" fill="none" stroke="#1d537f" stroke-width="3.5"/>
